<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Görüş ve Öneriler - KINEMAN</title>
    <style>
        body { background: #2c3e50; font-family: 'Inter', sans-serif; color: white; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .form-container { background: white; color: #2c3e50; border-radius: 12px; padding: 40px; width: 100%; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border-left: 6px solid #1abc9c; }
        h2 { margin: 0 0 10px 0; font-size: 1.6em; color: #2c3e50; font-weight: 800; }
        p { color: #7f8c8d; margin: 0 0 25px 0; font-size: 0.95em; line-height: 1.4; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9em; }
        input[type="text"], input[type="email"], textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 1em; background: #f8f9fa; color: #2c3e50; }
        textarea { resize: vertical; min-height: 120px; }
        .btn-submit { width: 100%; padding: 15px; background: #1abc9c; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1em; transition: background 0.3s; }
        .btn-submit:hover { background: #16a085; }
        .btn-submit:disabled { background: #95a5a6; cursor: not-allowed; }
        .btn-close { display: block; text-align: center; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-size: 0.9em; transition: color 0.3s; }
        .btn-close:hover { color: #2c3e50; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Görüş ve Önerileriniz</h2>
        <p>KINEMAN platformunu geliştirmemize yardımcı olmak için geri bildirimlerinizi <strong>lütfen</strong> bize iletin.</p>
        
        <div class="form-group">
            <label>Adınız Soyadınız (İsteğe Bağlı):</label>
            <input type="text" id="feedbackName" placeholder="Örn: Ahmet Yılmaz">
        </div>
        
        <div class="form-group">
            <label>E-posta Adresiniz (İsteğe Bağlı):</label>
            <input type="email" id="feedbackEmail" placeholder="Örn: ahmet@gazi.edu.tr">
        </div>
        
        <div class="form-group">
            <label>Görüş, Öneri veya Mesajınız:</label>
            <textarea id="feedbackMessage" placeholder="Lütfen mesajınızı buraya yazın..." required></textarea>
        </div>
        
        <button id="submitBtn" class="btn-submit" onclick="sendFeedbackToDrive()">Mesajı Gönder</button>
        <a href="javascript:window.close()" class="btn-close">Pencereyi Kapat</a>
    </div>

    <script>
        function sendFeedbackToDrive() {
            const name = document.getElementById('feedbackName').value.trim() || 'Belirtilmedi';
            const email = document.getElementById('feedbackEmail').value.trim() || 'Belirtilmedi';
            const message = document.getElementById('feedbackMessage').value.trim();
            const btn = document.getElementById('submitBtn');
            
            if (!message) {
                alert("Lütfen görüş veya öneri metni alanını doldurunuz.");
                return;
            }
            
            // Apps Script Deploy URL'nizi buraya yapıştırın
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSadvghFlnRdRWTic-A4w-BUFZ-EeaKFMAGz4RLDrT6NhbukHVvooxl_xMsn6R_Z9W/exec";
            
            // Butonu bekleme durumuna alıyoruz
            btn.innerText = "Gönderiliyor...";
            btn.disabled = true;

            // Verileri Form formatında paketliyoruz
            const formData = new URLSearchParams();
            formData.append('name', name);
            formData.append('email', email);
            formData.append('message', message);

            // POST komutu ile Apps Script'e gönderiyoruz
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if(data.result === "success") {
                    alert("Görüşünüz veri tabanına başarıyla işlendi. Teşekkür ederiz!");
                    window.close(); // İşlem bitince sekmeyi otomatik kapatır
                } else {
                    alert("Sistematik bir hata oluştu. Lütfen tekrar deneyin.");
                    btn.innerText = "Mesajı Gönder";
                    btn.disabled = false;
                }
            })
            .catch(error => {
                alert("Bağlantı hatası. İnternet erişiminizi kontrol edin.");
                btn.innerText = "Mesajı Gönder";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
